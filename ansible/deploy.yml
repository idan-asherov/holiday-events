---
- name: Deploy Holiday Events Container
  hosts: local
  gather_facts: false

  vars:
    container_name: "holiday-app"
    image_name: "holiday-events:latest"
    host_port: 8000
    container_port: 3000

  tasks:
    - name: Ensure existing container is stopped and removed
      ansible.builtin.command: >
        docker rm -f {{ container_name }}
      failed_when: false
      changed_when: true

    - name: Run Holiday Events container
      ansible.builtin.command: >
        docker run -d
        --name {{ container_name }}
        -p {{ host_port }}:{{ container_port }}
        --restart unless-stopped
        {{ image_name }}
      register: docker_run_result
      changed_when: docker_run_result.rc == 0

    - name: Wait for service to warm up
      ansible.builtin.pause:
        seconds: 3

    - name: Verify application health endpoint
      ansible.builtin.uri:
        url: "http://localhost:{{ host_port }}/health"
        method: GET
        status_code: 200
        return_content: yes
      register: health_check
      retries: 3
      delay: 2
      until: health_check.status == 200

    - name: Output deployment verification
      ansible.builtin.debug:
        msg: "Application deployed successfully. Health check returned: {{ health_check.json }}"
